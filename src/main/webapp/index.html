<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Kanban</title>
</head>

<body>
    <h1>Login</h1>

    <form action="../api/login" method="post">

        <div>
            <label for="users">Nome de usuário</label>
            <input id="users" type="text" name="users" required>
        </div>

        <div>
            <label for="psw">Senha</label>
            <input id="psw" type="password" name="psw" required>
        </div>

        <button type="submit">Entrar</button>
    </form>

    <p>
        Não possui conta?
        <a href="pages/cadastroUsuario.html">Cadastre-se</a>
    </p>
</body>
</html>
