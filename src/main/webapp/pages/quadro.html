<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/quadro.css">
    <title>Quadro | kanban</title>
   
</head>

<body>

    <header>
        <h1>Quadro Kanban</h1>
        <form action="/ticket/cadastro" method="post">
            <button class="adicionar">+ Adcionar Ticket</button>
    </header>
<main class="kanban-board">
    <div class="kanban-column backlog" data-area-id="1">
        <h2>Backlog</h2>
        <button type="button" class="adicionar">+</button>
        <div class="cards"></div>
    </div>

    <div class="kanban-column a-fazer" data-area-id="2">
        <h2>A fazer</h2>
        <button type="button" class="adicionar">+</button>
        <div class="cards"></div>
    </div>

    <div class="kanban-column em-andamento" data-area-id="3">
        <h2>Em andamento</h2>
        <button type="button" class="adicionar">+</button>
        <div class="cards"></div>
    </div>

    <div class="kanban-column concluido" data-area-id="4">
        <h2>Concluído</h2>
        <button type="button" class="adicionar">+</button>
        <div class="cards"></div>
    </div>
</main>
    <footer>
        <p>Em desenvolvimento</p>
    </footer>


</body>

</html>
